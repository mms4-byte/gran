<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متابعة منهج الانكليزي - السادس الإعدادي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --accent-green: #34C759;
            --accent-blue: #007AFF;
            --accent-purple: #AF52DE;
            --accent-orange: #FF9500;
            --accent-red: #FF3B30;
            --accent-teal: #30B0C7;
            --border-color: #E5E5EA;
            --radius-main: 20px;
            --radius-sub: 14px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1C1C1E;
                --text-primary: #FFFFFF;
                --text-secondary: #8E8E93;
                --border-color: #2C2C2E;
            }
            .ios-header {
                background: rgba(0, 0, 0, 0.85) !important;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tajawal", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 0;
            margin: 0;
            min-height: 100vh;
            width: 100%;
        }

        /* iOS Header Style - Full Width with Blur */
        .ios-header {
            position: sticky;
            top: 0;
            background: rgba(242, 242, 247, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 16px 4vw 20px 4vw;
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .title-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .score-badge {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(88, 86, 214, 0.3);
        }

        /* Progress Card with iPhone Blend */
        .progress-card {
            background: var(--card-bg);
            border-radius: var(--radius-main);
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            height: 12px;
            background: var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            /* iPhone vibrant blend gradient */
            background: linear-gradient(90deg, #007AFF, #5856D6, #AF52DE);
            background-size: 200% 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 6px;
        }

        /* Content Container */
        #contentContainer {
            padding: 24px 4vw 80px 4vw;
            width: 100%;
        }

        /* Group Card */
        .section-card {
            background: var(--card-bg);
            border-radius: var(--radius-main);
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }

        .icon-box svg {
            width: 20px;
            height: 20px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
        }

        .marks-tag {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            background: rgba(142, 142, 147, 0.12);
            padding: 6px 12px;
            border-radius: 8px;
        }

        /* Items List */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(142, 142, 147, 0.06);
            border-radius: var(--radius-sub);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .item-row:active {
            background: rgba(142, 142, 147, 0.12);
        }

        .item-label {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Custom iOS Checkbox - Light & Crisp Animation */
        .checkbox-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            flex-shrink: 0;
            background: transparent;
        }

        .checkbox-circle svg {
            width: 14px;
            height: 14px;
            color: white;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .item-row.checked .checkbox-circle {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            /* iPhone blend glow effect */
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.35);
        }

        .item-row.checked .checkbox-circle svg {
            opacity: 1;
            transform: scale(1);
        }

        .item-row.checked .item-label {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(52, 199, 89, 0.95);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="ios-header">
        <div class="title-container">
            <h1>خطة الانكليزي</h1>
            <span class="score-badge" id="scoreBadge">0 / 100 درجة</span>
        </div>
        <div class="progress-card">
            <div class="progress-text">
                <span>نسبة الإنجاز الكلية</span>
                <span id="percentText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
    </div>

    <div id="contentContainer"></div>

    <div id="saveToast" class="toast">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span>تم الحفظ تلقائياً</span>
    </div>

    <script>
        // تم إضافة "يونت سادس" بالترتيب الصحيح
        const unitsList = ["يونت أول", "يونت ثاني", "يونت ثالث", "يونت رابع", "يونت خامس", "يونت سادس", "يونت ثامن"];

        // أيقونات نظام احترافية (SVG)
        const icons = {
            bookOpen: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            book: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
            edit: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
            checkSquare: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
            layers: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
            link: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
            pencil: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`,
            chat: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
            share: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
            fileText: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`
        };

        const sectionsData = [
            { id: "s1", title: "القطعة الخارجية", marks: 10, color: "var(--accent-blue)", icon: icons.bookOpen, items: ["مراجعة واستراتيجيات الحل"] },
            { id: "s2", title: "قطع الكتاب", marks: 10, color: "var(--accent-green)", icon: icons.book, items: unitsList },
            { id: "s3", title: "قواعد (تطبيق وإعادة كتابة)", marks: 20, color: "var(--accent-purple)", icon: icons.edit, items: unitsList },
            { id: "s4", title: "قواعد (اختيارات)", marks: 10, color: "var(--accent-purple)", icon: icons.checkSquare, items: ["مراجعة شاملة لخيارات القواعد"] },
            { id: "s5", title: "إسقاطات (كلمات من الصندوق)", marks: 5, color: "var(--accent-orange)", icon: icons.layers, items: unitsList },
            { id: "s6", title: "توصيل مفردات وتعاريف", marks: 5, color: "var(--accent-teal)", icon: icons.link, items: unitsList },
            { id: "s7", title: "إملاء وإضافات", marks: 10, color: "var(--accent-red)", icon: icons.pencil, items: unitsList },
            { id: "s8", title: "أدب (سؤال وجواب)", marks: 10, color: "var(--accent-blue)", icon: icons.chat, items: ["محمد خضير - النجمة", "كاثرين مانسفيلد - الكناري"] },
            { id: "s9", title: "أدب (توصيل)", marks: 5, color: "var(--accent-teal)", icon: icons.share, items: ["توصيلات وشخصيات الأدب"] },
            { id: "s10", title: "الإنشاءات", marks: 15, color: "var(--accent-green)", icon: icons.fileText, items: unitsList }
        ];

        let state = JSON.parse(localStorage.getItem('english_prep6_state')) || {};

        function render() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';

            let totalItemsCount = 0;
            let checkedItemsCount = 0;
            let earnedMarks = 0;

            sectionsData.forEach(sec => {
                const card = document.createElement('div');
                card.className = 'section-card';

                let secCheckedCount = 0;

                const itemsHtml = sec.items.map((item, idx) => {
                    totalItemsCount++;
                    const itemKey = `${sec.id}_${idx}`;
                    const isChecked = !!state[itemKey];
                    if (isChecked) {
                        checkedItemsCount++;
                        secCheckedCount++;
                    }

                    return `
                        <div class="item-row ${isChecked ? 'checked' : ''}" onclick="toggleItem('${itemKey}')">
                            <span class="item-label">${item}</span>
                            <div class="checkbox-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                        </div>
                    `;
                }).join('');

                const secEarned = (secCheckedCount / sec.items.length) * sec.marks;
                earnedMarks += secEarned;

                card.innerHTML = `
                    <div class="section-header">
                        <div class="section-title-group">
                            <div class="icon-box" style="background: ${sec.color}">${sec.icon}</div>
                            <span class="section-title">${sec.title}</span>
                        </div>
                        <span class="marks-tag">${sec.marks} درجات</span>
                    </div>
                    <div class="items-list">${itemsHtml}</div>
                `;

                container.appendChild(card);
            });

            const percent = totalItemsCount ? Math.round((checkedItemsCount / totalItemsCount) * 100) : 0;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('percentText').innerText = percent + '%';
            document.getElementById('scoreBadge').innerText = `${Math.round(earnedMarks)} / 100 درجة`;
        }

        function toggleItem(key) {
            state[key] = !state[key];
            localStorage.setItem('english_prep6_state', JSON.stringify(state));
            render();
            showToast();
        }

        let toastTimeout;
        function showToast() {
            const toast = document.getElementById('saveToast');
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }

        render();
    </script>
</body>
</html>
